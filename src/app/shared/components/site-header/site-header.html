<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="e600Shop home">
      <span class="brand-mark" aria-hidden="true">e6</span>
      <span class="brand-name">e600<span class="brand-name-accent">Shop</span></span>
    </a>

    <nav class="primary-nav" id="primary-nav" [class.is-open]="menuOpen()" aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >Home</a
      >
      <a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Shop</a>
      <a routerLink="/cart" routerLinkActive="active" (click)="closeMenu()">Cart</a>
      <a routerLink="/checkout" routerLinkActive="active" (click)="closeMenu()">Checkout</a>
    </nav>

    <form class="header-search" role="search" (submit)="search($event)">
      <label class="visually-hidden" for="header-search-input">Search products</label>
      <input
        id="header-search-input"
        type="search"
        name="q"
        placeholder="Search products…"
        autocomplete="off"
        [value]="query()"
        (input)="onQueryInput($event)"
      />
      <button type="submit" class="header-search-btn" aria-label="Search">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20.5 20.5-4-4"></path>
        </svg>
      </button>
    </form>

    <a class="cart-link" routerLink="/cart" [attr.aria-label]="cartLabel()">
      <svg
        viewBox="0 0 24 24"
        width="22"
        height="22"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 4h2l2.3 10.9a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.55L20.5 8H6"></path>
        <circle cx="10" cy="20" r="1.4"></circle>
        <circle cx="17.5" cy="20" r="1.4"></circle>
      </svg>
      <span class="cart-link-label">Cart</span>
      @if (cart.count() > 0) {
        <span class="cart-badge" aria-hidden="true">{{ cart.count() }}</span>
      }
    </a>

    @if (auth.isSignedIn()) {
      <div class="header-account">
        <app-user-avatar [src]="auth.avatarUrl()" [name]="auth.displayName()" />
        <span class="header-account-name">{{ auth.displayName() }}</span>
        <button
          type="button"
          class="header-auth-btn"
          (click)="signOut()"
          [disabled]="auth.loading()"
        >
          Sign out
        </button>
      </div>
    } @else {
      <a
        class="header-auth-btn"
        routerLink="/login"
        (click)="closeMenu()"
        aria-label="Sign in with Google"
      >
        Sign in
      </a>
    }

    <button
      type="button"
      class="nav-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      (click)="menuOpen.update((open) => !open)"
    >
      <span class="visually-hidden">Toggle navigation menu</span>
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>
  </div>
</header>
